<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>User Management</h1>

        <nav>
            <button id="register-nav-btn">Register</button>
            <button id="login-nav-btn">Login</button>
            <button id="users-nav-btn">Users</button>
        </nav>
    </header>


    <main>

        <!-- Registration Section -->
        <section id="register-section">

            <h2>Register</h2>

            <form id="register-form">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="firstName" placeholder="Enter your first name" required>

                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="lastName" placeholder="Enter your last name" required>


                <fieldset>
                    <legend>Gender</legend>

                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>
                </fieldset>


                <label for="role">Role</label>

                <select id="role" name="role" required>
                    <option value="">Select role</option>
                    <option value="admin">Admin</option>
                    <option value="operations">Operations</option>
                    <option value="sales">Sales</option>
                </select>


                <button type="submit">Register</button>

            </form>

            <p id="register-message"></p>

        </section>


        
        <!-- Login Section -->
        <section id="login-section">

            <h2>Login</h2>

            <form id="login-form">

                <label for="login-username">Username</label>
                <input
                    type="text"
                    id="login-username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="login-password">Password</label>
                <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p id="login-message"></p>

        </section>

        <!-- Users Section -->
        <section id="users-section">

            <h2>Users</h2>

            <div id="users-list">
                <!-- JavaScript will add users here -->
            </div>

        </section>


    </main>


    <script src="script.js"></script>

</body>
</html>
